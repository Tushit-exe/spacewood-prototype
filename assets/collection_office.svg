<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="ambLightOffice" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#C8A87D" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#24262b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0a0c0e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="deskTop" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3c2a1c"/>
      <stop offset="60%" stop-color="#281b11"/>
      <stop offset="100%" stop-color="#19110a"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#C8A87D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C8A87D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#ambLightOffice)"/>

  <!-- Back Wall Bookcase / Credenza Storage -->
  <g opacity="0.45">
    <rect x="60" y="80" width="480" height="340" rx="4" fill="#13161a" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <line x1="60" y1="160" x2="540" y2="160" stroke="#C8A87D" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="60" y1="240" x2="540" y2="240" stroke="#C8A87D" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="60" y1="320" x2="540" y2="320" stroke="#C8A87D" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="220" y1="80" x2="220" y2="420" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    <line x1="380" y1="80" x2="380" y2="420" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  </g>

  <!-- Executive Bespoke Walnut Desk -->
  <polygon points="80,520 520,520 480,590 40,590" fill="url(#deskTop)" stroke="#C8A87D" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="40" y="590" width="440" height="80" fill="#1b140e" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Champagne Accent Trim on Desk -->
  <line x1="40" y1="590" x2="480" y2="590" stroke="#C8A87D" stroke-width="2"/>

  <!-- Architectural Minimalist Task Lamp -->
  <path d="M420,520 L420,380 L340,360" fill="none" stroke="#C8A87D" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="330" cy="360" rx="20" ry="8" fill="#C8A87D"/>
  <polygon points="330,365 240,540 400,540" fill="url(#lampGlow)" opacity="0.4"/>

  <!-- High-End Ergonomic Executive Chair Silhouette -->
  <path d="M260,420 C260,370 340,370 340,420 L330,550 C330,570 270,570 270,550 Z" fill="#181a1f" stroke="#C8A87D" stroke-opacity="0.3" stroke-width="1.5"/>
  <ellipse cx="300" cy="560" rx="55" ry="18" fill="#20232a"/>

  <!-- Downlight Cone -->
  <polygon points="300,0 200,320 400,320" fill="#C8A87D" opacity="0.08"/>
</svg>
