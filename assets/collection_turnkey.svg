<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="ambLight" cx="65%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C8A87D" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#3d2a1b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0e0b09" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="woodSlat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1e15"/>
      <stop offset="50%" stop-color="#3e2e21"/>
      <stop offset="100%" stop-color="#1f1610"/>
    </linearGradient>
    <linearGradient id="tvGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8A87D" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0C0A09" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="marbleTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282624"/>
      <stop offset="50%" stop-color="#1c1a18"/>
      <stop offset="100%" stop-color="#0f0e0d"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#ambLight)"/>

  <!-- Slatted Walnut Feature Wall -->
  <g opacity="0.65">
    <rect x="50" y="80" width="12" height="420" fill="url(#woodSlat)"/>
    <rect x="70" y="80" width="12" height="420" fill="url(#woodSlat)"/>
    <rect x="90" y="80" width="12" height="420" fill="url(#woodSlat)"/>
    <rect x="110" y="80" width="12" height="420" fill="url(#woodSlat)"/>
    <rect x="130" y="80" width="12" height="420" fill="url(#woodSlat)"/>
    <rect x="150" y="80" width="12" height="420" fill="url(#woodSlat)"/>
    <rect x="170" y="80" width="12" height="420" fill="url(#woodSlat)"/>
    <rect x="190" y="80" width="12" height="420" fill="url(#woodSlat)"/>
    <rect x="210" y="80" width="12" height="420" fill="url(#woodSlat)"/>
    <rect x="230" y="80" width="12" height="420" fill="url(#woodSlat)"/>
  </g>

  <!-- Floating Media Credenza Console -->
  <rect x="40" y="500" width="520" height="60" rx="4" fill="#1b1714" stroke="#C8A87D" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="40" y="496" width="520" height="4" fill="#C8A87D" opacity="0.8"/>
  <!-- Under-cabinet Warm LED Glow -->
  <rect x="40" y="560" width="520" height="25" fill="url(#tvGlow)"/>

  <!-- Modern Large Format Screen Outline with Ambient Backlight -->
  <rect x="140" y="160" width="380" height="230" rx="6" fill="#12100e" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- Screen Rim Backlight -->
  <rect x="136" y="156" width="388" height="238" rx="8" fill="none" stroke="#C8A87D" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Designer Marble Low Coffee Table -->
  <ellipse cx="380" cy="650" rx="140" ry="40" fill="url(#marbleTop)" stroke="#C8A87D" stroke-opacity="0.3"/>
  <line x1="280" y1="650" x2="280" y2="690" stroke="#C8A87D" stroke-width="3" stroke-linecap="round"/>
  <line x1="480" y1="650" x2="480" y2="690" stroke="#C8A87D" stroke-width="3" stroke-linecap="round"/>

  <!-- Ceiling Recessed Warm Downlight Cones -->
  <polygon points="400,0 340,300 460,300" fill="#C8A87D" opacity="0.08"/>
  <polygon points="200,0 150,260 250,260" fill="#C8A87D" opacity="0.06"/>

  <!-- Foreground Dark Vignette -->
  <rect width="600" height="800" fill="url(#ambLight)" opacity="0.2"/>
</svg>
